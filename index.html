<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊档案 - 深海生物图鉴</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌊 <span>深渊档案</span></a>
            <button class="nav-toggle" onclick="toggleMenu()">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="browse.html">分类浏览</a></li>
                <li><a href="explore.html">深度探索</a></li>
                <li><a href="compare.html">生物对比</a></li>
                <li><a href="timeline.html">探索时间线</a></li>
                <li><a href="favorites.html">我的收藏</a></li>
                <li style="display:flex;align-items:center;gap:12px;" id="navAuth"></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <!-- Hero区 -->
        <section class="hero">
            <h1>探索深海的未知世界</h1>
            <p>潜入地球最后的边疆，认识那些在极端黑暗、巨大压力中生存的神秘生物。从热泉到海沟，每一种生命都是进化的奇迹。</p>
            <div class="hero-buttons">
                <a href="browse.html" class="btn btn-primary">🔍 开始浏览</a>
                <button class="btn btn-outline" onclick="randomExplore()">🎲 随机探索</button>
            </div>
        </section>

        <!-- 统计数据 -->
        <section class="stats-section" id="statsSection">
            <div class="stat-card">
                <div class="stat-number" id="totalSpecies">--</div>
                <div class="stat-label">收录物种</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="maxDepth">--</div>
                <div class="stat-label">最大深度(米)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">4</div>
                <div class="stat-label">深度带</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">6</div>
                <div class="stat-label">生物分类</div>
            </div>
        </section>

        <!-- 精选生物 -->
        <h2 class="section-title">🌟 精选深海生物</h2>
        <div class="creature-grid" id="featuredCreatures">
            <div class="loading">正在加载深海生物</div>
        </div>

        <!-- 深海冷知识轮播 -->
        <div class="facts-carousel">
            <div class="fact-text" id="factText">深海占地球表面积的65%，但人类探索过的海底不到5%...</div>
            <div class="fact-source" id="factSource">— 深海冷知识</div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>🌊 深渊档案 - 深海生物图鉴 | 探索地球最后的未知领域</p>
        <p style="margin-top:8px;">图片来源：NOAA、MBARI、维基百科等海洋研究机构</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
