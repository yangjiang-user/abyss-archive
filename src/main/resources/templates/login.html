<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 深渊档案</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a th:href="@{/}" class="nav-logo">🌊 深渊档案</a>
            <ul class="nav-links">
                <li><a th:href="@{/login}">登录</a></li>
                <li><a th:href="@{/register}">注册</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <h2>🔐 用户登录</h2>

        <!-- 错误提示 -->
        <div class="error-msg" th:if="${error}" th:text="${error}" style="display:block;"></div>
        <!-- 成功提示 -->
        <div class="success-msg" th:if="${success}" th:text="${success}" style="display:block;"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-primary">登 录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a th:href="@{/register}">立即注册</a>
        </div>
        <div class="auth-footer" style="margin-top:12px;font-size:13px;color:#6b7d8f;">
            内置管理员：admin / admin123（直接登录，无需注册）
        </div>
    </div>
</body>
</html>
