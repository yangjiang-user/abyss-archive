<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类浏览 - 深渊档案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌊 <span>深渊档案</span></a>
            <button class="nav-toggle" onclick="toggleMenu()">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="browse.html" class="active">分类浏览</a></li>
                <li><a href="explore.html">深度探索</a></li>
                <li><a href="compare.html">生物对比</a></li>
                <li><a href="timeline.html">探索时间线</a></li>
                <li><a href="favorites.html">我的收藏</a></li>
                <li style="display:flex;align-items:center;gap:12px;" id="navAuth"></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="section-title">🐠 分类浏览</h1>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>搜索：</label>
                <input type="text" class="filter-input" id="searchInput" placeholder="输入中文名/英文名/特征..." onkeyup="handleSearch(event)">
            </div>
            <div class="filter-group">
                <label>分类：</label>
                <select class="filter-select" id="categoryFilter" onchange="loadCreatures()">
                    <option value="">全部分类</option>
                </select>
            </div>
            <div class="filter-group">
                <label>深度带：</label>
                <select class="filter-select" id="depthFilter" onchange="loadCreatures()">
                    <option value="">全部深度</option>
                </select>
            </div>
            <div class="filter-group">
                <label>栖息地：</label>
                <select class="filter-select" id="habitatFilter" onchange="loadCreatures()">
                    <option value="">全部栖息地</option>
                </select>
            </div>
        </div>

        <!-- 生物列表 -->
        <div class="creature-grid" id="creatureGrid">
            <div class="loading">正在加载深海生物</div>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination"></div>
    </div>

    <footer class="footer">
        <p>🌊 深渊档案 - 深海生物图鉴</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/browse.js"></script>
</body>
</html>
