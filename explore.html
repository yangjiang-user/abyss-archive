<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深度探索器 - 深渊档案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌊 <span>深渊档案</span></a>
            <button class="nav-toggle" onclick="toggleMenu()">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="browse.html">分类浏览</a></li>
                <li><a href="explore.html" class="active">深度探索</a></li>
                <li><a href="compare.html">生物对比</a></li>
                <li><a href="timeline.html">探索时间线</a></li>
                <li><a href="favorites.html">我的收藏</a></li>
                <li style="display:flex;align-items:center;gap:12px;" id="navAuth"></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="section-title">🌊 深度探索器</h1>
        <p style="color:var(--text-secondary);margin-bottom:20px;">拖动或点击深度标尺，探索不同深度的深海生物。从海平面到马里亚纳海沟最深处。</p>

        <div class="explorer-container">
            <!-- 深度标尺 -->
            <div class="depth-ruler" id="depthRuler">
                <div class="depth-indicator" id="depthIndicator" style="top:0%"></div>
                <div class="depth-marks" id="depthMarks"></div>
            </div>

            <!-- 内容区 -->
            <div class="explorer-content">
                <div class="explorer-depth-display" id="currentDepth">0 米</div>
                <div class="explorer-zone" id="currentZone">海平面</div>

                <!-- 深度滑块 -->
                <div style="margin:20px 0;">
                    <input type="range" min="0" max="11000" value="0" 
                           style="width:100%;accent-color:var(--accent-cyan);" 
                           id="depthSlider" oninput="updateDepth(this.value)">
                </div>

                <h3 style="color:var(--accent-cyan);margin:20px 0 12px;">此深度的生物</h3>
                <div class="explorer-creatures" id="depthCreatures">
                    <div class="loading">拖动滑块探索</div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>🌊 深渊档案 - 深海生物图鉴</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>
