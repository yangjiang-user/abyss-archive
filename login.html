<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 深渊档案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌊 <span>深渊档案</span></a>
            <button class="nav-toggle" onclick="toggleMenu()">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="browse.html">分类浏览</a></li>
                <li><a href="explore.html">深度探索</a></li>
                <li><a href="compare.html">生物对比</a></li>
                <li><a href="timeline.html">探索时间线</a></li>
                <li><a href="favorites.html">我的收藏</a></li>
                <li style="display:flex;align-items:center;gap:12px;" id="navAuth"></li>
            </ul>
        </div>
    </nav>

    <!-- 登录表单 -->
    <div class="auth-container">
        <h2>🔐 用户登录</h2>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="loginForm" onsubmit="return doLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-primary">登 录</button>
        </form>
        <div class="auth-footer">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
        <div class="auth-footer" style="margin-top:12px;font-size:13px;color:#6b7d8f;">
            内置管理员：admin / admin123（直接登录，无需注册）
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        // 已登录则跳转首页
        if (isLoggedIn()) { location.href = 'index.html'; }

        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // 从localStorage读取用户列表
            const users = JSON.parse(localStorage.getItem('abyss_users') || '[]');
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                // 登录成功，保存登录状态
                setLogin(user);
                successMsg.textContent = '登录成功，正在跳转...';
                successMsg.style.display = 'block';
                setTimeout(() => { location.href = 'index.html'; }, 800);
            } else {
                errorMsg.textContent = '用户名或密码错误';
                errorMsg.style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
